<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tjBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A16"/>
      <stop offset="100%" stop-color="#080806"/>
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="tjRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDF77B"/>
      <stop offset="45%" stop-color="#6747C7"/>
      <stop offset="100%" stop-color="#EE83CB"/>
    </linearGradient>

    <!-- T Gold/Lime Radiant Gradient -->
    <linearGradient id="tjLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FFB8"/>
      <stop offset="50%" stop-color="#DDF77B"/>
      <stop offset="100%" stop-color="#B8F03C"/>
    </linearGradient>

    <!-- J Electric Accent Gradient -->
    <linearGradient id="tjAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#DDF77B"/>
      <stop offset="100%" stop-color="#9AE600"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="tjGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Glass Frame with Gradient Border -->
  <rect x="3" y="3" width="94" height="94" rx="26" fill="url(#tjBg)" stroke="url(#tjRing)" stroke-width="2.5" />

  <!-- Inner Ambient Glow Spot -->
  <circle cx="50" cy="50" r="30" fill="#DDF77B" opacity="0.08" filter="url(#tjGlow)"/>

  <!-- Sleek Interlocking TJ Monogram -->
  <g transform="translate(1, 0)">
    <!-- Letter T: Top Architectural Crossbar with Sharp Chamfered Edges -->
    <path d="M 22 27 L 66 27 L 62 36 L 49 36 L 49 73 L 37 73 L 37 36 L 25 36 Z" 
          fill="url(#tjLime)" 
          filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))" />

    <!-- Letter J: Dynamic Interlocking Swoop on the Right curving under T -->
    <path d="M 68 36 L 78 36 L 78 67 C 78 77 70 82 58 82 C 48 82 40 78 34 72 L 40 64 C 44 68 49 71 56 71 C 62 71 66 68 66 62 L 66 43 L 56 43 L 59 36 L 68 36 Z" 
          fill="url(#tjAccent)" 
          filter="drop-shadow(0 2px 6px rgba(221,247,123,0.3))" />

    <!-- Luxury Geometric Sparkle Diamond Accent in Top Right -->
    <path d="M 77 22 L 79 26 L 83 28 L 79 30 L 77 34 L 75 30 L 71 28 L 75 26 Z" 
          fill="#DDF77B" 
          opacity="0.9" />
  </g>
</svg>